name: Deploy to GitHub Pages

# Manual only. Production is hiranmayedigital.com on HostingRaja (deploy.yml); an automatic
# GitHub Pages copy would be a second public version of the site for search engines to index.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build
        run: npm run build:site
        env:
          # Project site: served from /<repo>/. Set this repo variable to "/"
          # once a custom domain (e.g. hiranmayedigital.com) is attached.
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
          # Public URL for canonical links, social previews and the sitemap.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
